[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming-shorts-clipper"
version = "0.1.0"
description = "Turn the most-replayed moment of a gaming video into a ready-to-post vertical Short."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default,deno]>=2026.10.26",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "pillow>=10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# NVIDIA's cuBLAS for CUDA 12: all the speech model (CTranslate2) needs to run on an NVIDIA GPU
gpu = ["nvidia-cublas-cu12>=12.4,<13"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
